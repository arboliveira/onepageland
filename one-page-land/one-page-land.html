<html lang="en"
      xmlns:customary="https://customaryjs.github.io/schema"
      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
      xsi:schemaLocation="https://customaryjs.github.io/schema https://customaryjs.github.io/customary.xsd"
>
<div id="hypostasis">
	<customary:if condition="{{text}}">
		<div id="page-text">
			<customary:for items="{{text_lines}}" value="line">
				<span class="text-line">{[line.text]}</span>
				<customary:classMap
						target=".text-line"
						classInfo="{[line.classInfo]}"
				>
				</customary:classMap>
				<customary:styleMap
						target=".text-line"
						styleInfo="{[line.styleInfo]}"
				>
				</customary:styleMap>
			</customary:for>
		</div>
	</customary:if>
</div>

<customary:classMap
		target="#hypostasis"
		classInfo="{{classInfo}}"
>
</customary:classMap>

<customary:styleMap
		target="#hypostasis"
		styleInfo="{{styleInfo}}"
>
</customary:styleMap>

</html>
