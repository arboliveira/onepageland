<html lang="en"
      xmlns:customary="https://customaryjs.github.io/schema"
      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
      xsi:schemaLocation="https://customaryjs.github.io/schema https://customaryjs.github.io/customary.xsd"
>
<div id="hypostasis">
	<customary:if condition="{{text}}">
		<div id="page-text">
			<customary:for items="{{text_lines}}" value="line">
				<span class="text-line" style="{[line.style]}">{[line.text]}</span>
			</customary:for>
		</div>
	</customary:if>
</div>

<customary:if condition="{{options_inlined_visible_bool}}">
	<one-page-options></one-page-options>
</customary:if>

<customary:classMap
		target="#hypostasis"
		classInfo="{{classInfo}}"
>
</customary:classMap>

<customary:styleMap
		target="#hypostasis"
		styleInfo="{{styleInfo}}"
>
</customary:styleMap>

</html>
