<html lang="en"
      xmlns:customary="https://customaryjs.github.io/schema"
      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
      xsi:schemaLocation="https://customaryjs.github.io/schema https://customaryjs.github.io/customary.xsd"
>
<div id="options-backdrop">
	<div id="options-panel">
			<div id="options-title">One Page Land</div>

			<!--
				The form is its own element, and deliberately one with no shadow root:
				that is what lets it hear the non-composed "submit" natively and
				re-announce it as the composed "options_form_submit" we listen for.
				Its fields stay its own: they travel up already resolved, as
				"options_updated"; the URL and the preview are computed here from that
				and handed down.
				(No backticks in this comment: the template is compiled through a
				JavaScript template literal, and a backtick would end it early.)
			-->
			<one-page-options-form
					window_location_search_at_time_of_connected="{{window_location_search_at_time_of_connected}}"
					params_preview="{{params_preview}}"
					params_url="{{params_url}}"
					data-customary-expressions
					data-customary-expression-name="per_line_entries"
					data-customary-expression-data="{{per_line_entries}}"
			></one-page-options-form>

		<div id="tools-zone">
			<div id="placement-controls">
				<customary:if condition="{{is_inline}}">
					<button id="move-to-window-btn" type="button" title="Move to window">↗</button>
				</customary:if>
				<customary:if condition="{{is_in_window_bool}}">
					<button id="move-inline-btn" type="button" title="Move inline">↙</button>
				</customary:if>
			</div>
			<label id="live-view-label">
				<input type="checkbox" data-customary-bind="live_editing_dont" />
				Pause live editing
			</label>
			<div id="website-links">
				<a href="https://github.com/arboliveira/onepageland" target="_blank" title="GitHub">
					<img alt="GitHub icon"
						 style="height: 16px; width: 16px; vertical-align: middle;"
						 src="GitHub_Invertocat_Black.png"/>
				</a>
				<a href="https://arbo.nexus" target="_blank" title="arbo.nexus">🤓</a>
				<a href="https://customary.js.org" target="_blank" title="Customary">👵</a>
			</div>
		</div>
	</div>
</div>
</html>
