<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><link rel="icon" href="../favicon.svg" /><title>
	Options ~ One Page Land
</title>
	<style>
		html, body { margin: 0; height: 100%; }
		#options-backdrop {
			position: static;
			background: none;
			display: flex;
			align-items: flex-start;
			min-height: 100%;
		}
		#options-panel {
			flex: 1;
			min-height: 100dvh;
			border-radius: 0;
			box-sizing: border-box;
		}
	</style>
</head>

<body>
	<!--
		Being the whole of a popped-out window is something only this page knows: it says
		so, rather than leaving the element to probe `window.opener` for the answer.
		Everywhere else the attribute is absent, and absent is what inline means.
	-->
	<one-page-options is_in_window="true"></one-page-options>

<script type="importmap">{"imports": {
	"#onepageland/": "../",
	"#customary": "../_dependencies/customary/customary.mjs"
}}</script>
<script type="module">
	import "./one-page-options.js";

	/* being the page that owns this window, we are the one that gets to close it */
	document.querySelector('one-page-options')
		.addEventListener('close_me_please', () => window.close());
</script>

</body>
</html>
